services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: local-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-localrag}
      POSTGRES_USER: ${POSTGRES_USER:-localrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in local-infrastructure/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - local_rag_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  local_rag_postgres_data:

